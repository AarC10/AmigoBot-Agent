services:
  ros:
    user: "${UID}:${GID}"
    build: .
    image: amigobot:noetic
    # Mount the repo root into the container so IDE edits are reflected immediately
    volumes:
      - ./:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: "host"
    tty: true
    stdin_open: true
    working_dir: /workspace
    devices:
      - /dev/video0:/dev/video0
      - /dev/dri:/dev/dri
    group_add:
      - "video"
    privileged: true

